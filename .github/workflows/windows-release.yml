name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  WINDOWS_SIGNING_CERT_SUBJECT: ${{ secrets.WINDOWS_SIGNING_CERT_SUBJECT }}

jobs:
  build-windows-installer:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 PyInstaller

      - name: Validate signing configuration
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_SIGNING_CERT_SUBJECT) {
            throw "Missing required secret WINDOWS_SIGNING_CERT_SUBJECT. Refusing to publish an unsigned release artifact."
          }

          $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if (-not $signtool) {
            throw "signtool.exe is required for Authenticode signing."
          }

      - name: Build DRY Defense executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name DRYDefense lesson_converter_app\main.py

      - name: Sign executable
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\DRYDefense.exe'
          signtool.exe sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /n "$env:WINDOWS_SIGNING_CERT_SUBJECT" /v "$exe"

      - name: Sign installer script
        shell: pwsh
        run: |
          $installer = Join-Path $env:GITHUB_WORKSPACE 'install_dry_defense.ps1'
          $cert = Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Subject -match $env:WINDOWS_SIGNING_CERT_SUBJECT } | Select-Object -First 1
          if (-not $cert) {
            throw "No certificate matching subject '$env:WINDOWS_SIGNING_CERT_SUBJECT' in Cert:\CurrentUser\My."
          }
          Set-AuthenticodeSignature -FilePath $installer -Certificate $cert -TimestampServer 'http://timestamp.digicert.com' | Out-Null

      - name: Prepare release bundle
        shell: pwsh
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'dist\DRY-Defense-Windows'
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'dist\DRYDefense.exe') (Join-Path $bundle 'DRYDefense.exe') -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'install_dry_defense.ps1') (Join-Path $bundle 'install_dry_defense.ps1') -Force
          Compress-Archive -Path (Join-Path $bundle '*') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'dist\DRY-Defense-Windows.zip') -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DRY-Defense-Windows
          path: dist/DRY-Defense-Windows.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/DRY-Defense-Windows.zip
